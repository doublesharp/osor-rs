[package]
name = "osor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT AND MIT-CMU"
publish = ["crates-io"]
description = "Native Rust OSOR SDXL Phase II inference"
repository = "https://github.com/doublesharp/osor-rs"
homepage = "https://github.com/doublesharp/osor-rs"
documentation = "https://docs.rs/osor"
readme = "README.md"
keywords = ["inpainting", "object-removal", "sdxl", "inference", "candle"]
categories = ["computer-vision", "multimedia::images", "science"]
exclude = ["/.github/", "/AGENTS.md", "/.gitignore", "/deny.toml"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
all-features = false

[features]
default = []
metal = ["dep:candle-metal-kernels", "dep:objc2-metal", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["dep:candle-kernels", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
wgpu = ["dep:burn", "dep:pollster"]
# Opt-in: tunes WGPU matmul/convolution kernels by timing them at run time.
# Faster warm inference, but each process pays a long first-job tuning cost
# and may select different kernels than another process (see docs/wgpu.md).
wgpu-autotune = ["wgpu", "burn/autotune"]
# macOS only: route Candle CPU matrix products through Apple Accelerate.
# Changes CPU accumulation order; requalify stage tolerances before relying on it.
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]

[dependencies]
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
# Kernel crates must match candle-core exactly; the Metal column kernel uses
# candle-metal-kernels' safe Metal wrappers.
candle-metal-kernels = { version = "=0.11.0", optional = true }
candle-kernels = { version = "=0.11.0", optional = true }
# Same Metal bindings as candle-metal-kernels; only `MTLSize` is named here.
objc2-metal = { version = "=0.3.2", optional = true, default-features = false, features = ["MTLTypes"] }
# Pure-Rust math keeps seeded noise identical across platform math libraries.
libm = "=0.2.16"
safetensors = "=0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.1"
thiserror = "2.0"
burn = { version = "=0.22.1", default-features = false, features = ["std", "wgpu"], optional = true }
pollster = { version = "=1.0.1", optional = true }


[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[profile.dev]
# Artifact hashing/encoding and tensor orchestration are exercised on real model
# sizes during development; keep those loops optimized without rebuilding deps.
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependency debug assertions and overflow checks made Candle CPU inference
# about 7x slower than release on the 80x96 qualification input.
opt-level = 2
debug = false
debug-assertions = false
overflow-checks = false

# Timing and memory measurements use this profile, never the dev profile.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
