[package]
name = "osor-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Native Rust OSOR SDXL Phase II inference"

[features]
default = []
metal = ["dep:candle-metal-kernels", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["dep:candle-kernels", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
wgpu = ["dep:burn", "dep:pollster"]
# macOS only: route Candle CPU matrix products through Apple Accelerate.
# Changes CPU accumulation order; requalify stage tolerances before relying on it.
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]

[dependencies]
candle-core = { version = "=0.9.1", default-features = false }
candle-nn = { version = "=0.9.1", default-features = false }
candle-transformers = { version = "=0.9.1", default-features = false }
# Candle 0.9.1 uses APIs removed by the semver-compatible 0.9.2 kernels.
candle-metal-kernels = { version = "=0.9.1", optional = true }
candle-kernels = { version = "=0.9.1", optional = true }
# Pure-Rust math keeps seeded noise identical across platform math libraries.
libm = "=0.2.16"
safetensors = "=0.4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
thiserror = "2.0"
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu"], optional = true }
pollster = { version = "=0.4.0", optional = true }

# Enable AArch64 SHA-256 acceleration on Apple; unsupported CPUs use software.
[target.'cfg(all(target_arch = "aarch64", target_vendor = "apple"))'.dependencies]
sha2 = { version = "=0.10.9", features = ["asm"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[profile.dev]
# Artifact hashing/encoding and tensor orchestration are exercised on real model
# sizes during development; keep those loops optimized without rebuilding deps.
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependency debug assertions and overflow checks made Candle CPU inference
# about 7x slower than release on the 80x96 qualification input.
opt-level = 2
debug = false
debug-assertions = false
overflow-checks = false

# Timing and memory measurements use this profile, never the dev profile.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
