name: Publish crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      publish:
        description: Upload to crates.io after all checks pass
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag name
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a release tag such as v0.1.0.' >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Match package version and freeze source
        id: source
        shell: bash
        env:
          OSOR_SCRATCH_ROOT: ${{ runner.temp }}/osor-rs
        run: |
          version=$(./scripts/cargo.sh metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "osor") | .version')
          test "$TAG" = "v$version"
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  checks:
    needs: release
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.release.outputs.sha }}

  package:
    needs: [release, checks]
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build CPU API documentation
        run: ./scripts/cargo.sh doc --locked --no-deps --lib
        env:
          OSOR_SCRATCH_ROOT: ${{ runner.temp }}/osor-rs
          RUSTDOCFLAGS: -D warnings
      - name: Verify the packaged crate
        run: ./scripts/cargo.sh publish --locked --dry-run
        env:
          OSOR_SCRATCH_ROOT: ${{ runner.temp }}/osor-rs

  publish:
    if: inputs.publish
    needs: [release, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ needs.release.outputs.sha }}
      HAS_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Confirm the release tag still names the checked source
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$SOURCE_SHA"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_PUBLISH_TOKEN != 'true'
      - name: Publish to crates.io
        run: ./scripts/cargo.sh publish --locked
        env:
          OSOR_SCRATCH_ROOT: ${{ runner.temp }}/osor-rs
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
