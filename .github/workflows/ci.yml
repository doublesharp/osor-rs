name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit to check for a release
        required: true
        type: string

permissions:
  contents: read

jobs:
  cpu:
    name: CPU checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Format, Clippy, and tests
        env:
          OSOR_SCRATCH_ROOT: ${{ runner.temp }}/osor-rs
        shell: bash
        run: ./scripts/check.sh

  metal-build:
    name: Metal feature compile (macOS)
    runs-on: macos-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Check Metal and Accelerate features (build only)
        env:
          OSOR_SCRATCH_ROOT: ${{ runner.temp }}/osor-rs
        shell: bash
        run: |
          ./scripts/cargo.sh check --locked --all-targets --features metal
          ./scripts/cargo.sh check --locked --all-targets --features accelerate

  cuda-build:
    # Compile-only: candle-kernels needs nvcc, not a GPU. This is source
    # evidence, not CUDA device qualification.
    name: CUDA feature compile (Linux container)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    env:
      CUDA_COMPUTE_CAP: "80"
    steps:
      - name: Install build prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git build-essential pkg-config
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Check CUDA feature (build only)
        env:
          OSOR_SCRATCH_ROOT: ${{ runner.temp }}/osor-rs
        shell: bash
        run: ./scripts/cargo.sh check --locked --all-targets --features cuda

  supply-chain:
    # Enforces deny.toml: allowed code licenses, crates.io-only sources,
    # banned libtorch/Python/model-download crates and triaged advisories.
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  wgpu:
    name: WGPU source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: WGPU Clippy and ordinary tests (no device qualification)
        env:
          OSOR_SCRATCH_ROOT: ${{ runner.temp }}/osor-rs
        shell: bash
        run: |
          ./scripts/cargo.sh clippy --locked --all-targets --features wgpu -- -D warnings
          ./scripts/cargo.sh test --locked --all-targets --features wgpu
          ./scripts/cargo.sh check --locked --all-targets --features wgpu-autotune
